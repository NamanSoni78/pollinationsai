<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldSim Terminal · Pollinations</title>
<link rel="stylesheet" href="polli.css">
<style>
  /* ---- CRT terminal skin ---- */
  .layout { display: flex; gap: 16px; align-items: stretch; margin-top: 18px; }
  .term-card { flex: 1; min-width: 0; padding: 12px; }
  .panel { width: 280px; flex-shrink: 0; align-self: flex-start; }

  .crt {
    position: relative;
    background: #04080a;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    height: min(62vh, 560px);
    min-height: 380px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.75), 0 0 28px rgba(51, 255, 102, 0.05);
  }
  /* scanlines */
  .crt::after {
    content: '';
    position: absolute; inset: 0; z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
  }
  /* vignette */
  .crt::before {
    content: '';
    position: absolute; inset: 0; z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.5) 100%);
  }
  .crt.flash { animation: crtflash 0.9s ease; }
  @keyframes crtflash { 0% { filter: brightness(2.2) saturate(1.6); } 100% { filter: none; } }

  #out {
    flex: 1; overflow-y: auto;
    padding: 14px 16px 4px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.45em; }

  /* phosphor themes */
  .theme-green  { color: #39ff6e; text-shadow: 0 0 6px rgba(57, 255, 110, 0.35); }
  .theme-amber  { color: #ffb000; text-shadow: 0 0 6px rgba(255, 176, 0, 0.35); }
  .theme-cyan   { color: #59f7ff; text-shadow: 0 0 6px rgba(89, 247, 255, 0.35); }
  .theme-mint   { color: #8affc1; text-shadow: 0 0 6px rgba(138, 255, 193, 0.3); }
  .line.dim   { opacity: 0.55; }
  .line.gold  { color: var(--accent); text-shadow: 0 0 8px rgba(245, 197, 24, 0.5); font-weight: 700; }
  .line.err   { color: var(--bad); }
  .line.faint { opacity: 0.4; }

  .boot-opt { cursor: pointer; padding: 1px 4px; border-radius: 4px; }
  .boot-opt:hover { background: rgba(255, 255, 255, 0.08); }

  .inputline {
    display: flex; align-items: center; gap: 0;
    padding: 4px 16px 14px;
    font-family: var(--mono);
    font-size: 13.5px;
    cursor: text;
  }
  #mirror { white-space: pre; }
  .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    background: currentColor;
    margin-left: 1px;
    animation: blink 1.06s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .offscreen { position: absolute; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }

  .panel h3 { margin-top: 16px; }
  .panel h3:first-child { margin-top: 0; }
  .panel .disc-row { display: flex; gap: 8px; padding: 5px 0; font-size: 13px; border-bottom: 1px dashed var(--border); }
  .panel .disc-row:last-child { border-bottom: 0; }
  .panel .disc-row.locked { color: var(--text-faint); }
  .panel .disc-row.open { color: var(--accent); }
  #disc-count { margin: 8px 0 10px; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .panel { width: 100%; order: 2; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="layout">
      <div class="card term-card">
        <div class="crt theme-green" id="crt">
          <div id="out" aria-live="polite"></div>
          <div class="inputline" id="inputline">
            <span id="ps1">worldsim&gt;&nbsp;</span><span id="mirror"></span><span class="cursor"></span>
          </div>
          <input id="cli" class="offscreen" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input">
        </div>
      </div>
      <aside class="card panel">
        <h3>Machine</h3>
        <div id="panel-persona" class="mono faint">not booted</div>
        <h3>Model</h3>
        <div id="panel-model" class="mono faint">openai/gpt-5.4-nano</div>
        <h3>Secret hunt</h3>
        <div id="disc-count" class="chip gold">Discoveries: 0 / 4</div>
        <div id="disc-list"></div>
        <p class="small faint" style="margin-top:14px">
          Type <span class="mono">secrets</span> for hints. Each machine hides
          4 secrets — poke the filesystem, run odd commands, read the docs.
          <span class="mono">cat</span> results are cached locally, so re-reading
          a file costs no pollen.
        </p>
      </aside>
    </div>
  </div>

  <script src="pollinations.js"></script>
  <script src="polli-common.js"></script>
  <script src="app.js"></script>
</body>
</html>
